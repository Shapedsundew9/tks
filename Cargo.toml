[package]
name = "tks"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "The Knowledge Substrate"
license = "MIT"
readme = "README.md"
default-run = "tks"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
deadpool-postgres = "0.14"
postgres = "0.19"
refinery = { version = "0.8", features = ["tokio-postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
pulldown-cmark = "0.13"
regex = "1"
git2 = "0.20"
fastembed = { version = "4", optional = true }
sha2 = "0.10"
tokio-util = "0.7"
axum = { version = "0.8" }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }
moka = { version = "0.12", features = ["future"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

[features]
default = ["vector-spike"]
vector-spike = ["dep:fastembed"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lib]
name = "tks"
path = "src/lib.rs"

[[bin]]
name = "tks"
path = "src/main.rs"

[[bin]]
name = "mcp_stdio"
path = "src/bin/mcp_stdio.rs"

[[bin]]
name = "h1_spike_eval"
path = "scripts/spikes/h1_spike/main.rs"

[[bin]]
name = "vector_spike_eval"
path = "scripts/spikes/vector_spike/main.rs"
required-features = ["vector-spike"]

[[bench]]
name = "ast_decomposition_bench"
harness = false

[[bench]]
name = "vector_inference_bench"
harness = false
required-features = ["vector-spike"]
