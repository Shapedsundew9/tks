services:
  app:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: Dockerfile
      pull: true
    volumes:
      - ..:/workspace:cached
      - tks-gitdata:/git
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/postgres}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      TKS_LLM_BASE_URL: ${TKS_LLM_BASE_URL:-http://ollama:11434/v1}
      TKS_LLM_MODEL: ${TKS_LLM_MODEL:-qwen3:8b}
    depends_on:
      ollama:
        condition: service_healthy
    command: sleep infinity

  ollama:
    image: ollama/ollama:0.12.8
    pull_policy: if_not_present
    restart: unless-stopped
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
    expose:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=127.0.0.1:11434 ollama list >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    volumes:
      - tks-ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  neo4j:
    image: neo4j:community
    pull_policy: always
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"

  postgres:
    image: pgvector/pgvector:pg16
    pull_policy: if_not_present
    shm_size: 128mb
    volumes:
      - tks-pgdata:/var/lib/postgresql/data
      - tks-gitdata:/git
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

volumes:
  neo4j_data:
  neo4j_logs:
  tks-pgdata:
  tks-gitdata:
  tks-ollama-models:

networks:
  default:
    name: devcontainer_default
    ipam:
      driver: default
      config:
        - subnet: 10.254.100.0/24
          gateway: 10.254.100.1
