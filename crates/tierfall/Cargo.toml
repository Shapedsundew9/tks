[package]
name = "tierfall"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Free-tier LLM fallback router: an OpenAI-compatible library and proxy that cascades across accounts and models as quotas run out"
license = "MIT"
repository = "https://github.com/Shapedsundew9/tks"
readme = "README.md"
keywords = ["llm", "openai", "gemini", "fallback", "proxy"]
categories = ["web-programming::http-client", "command-line-utilities"]

[features]
default = ["server"]
server = ["dep:axum", "dep:clap", "dep:tracing-subscriber"]

[dependencies]
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "net", "signal", "io-std", "io-util"] }
toml = "0.9"
tracing = "0.1"
axum = { version = "0.8", optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"

[lib]
name = "tierfall"
path = "src/lib.rs"

[[bin]]
name = "tierfall"
path = "src/main.rs"
required-features = ["server"]
